name: Build and Release Multiplatform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build macOS App and DMG
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/Snowdrift.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux binary
        run: |
          cargo build --release --bin Snowdrift
          mkdir -p dist-linux
          cp target/release/Snowdrift dist-linux/snowdrift
          cp README.md dist-linux/
          tar -czvf Snowdrift-linux-x86_64.tar.gz -C dist-linux .

      - name: Upload Linux archive to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: Snowdrift-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows (EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows app
        shell: bash
        run: cargo build --release --bin Snowdrift

      # The installer carries the app inside it, so the app must be signed first.
      - name: Sign Windows app
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "::warning title=Unsigned Windows build::WINDOWS_CERT_PFX_BASE64 is not set. SmartScreen and Defender will warn about this release. See docs/windows-smartscreen.md."
            exit 0
          }
          ./scripts/sign-windows.ps1 -Files target/release/Snowdrift.exe -PfxBase64 $env:WINDOWS_CERT_PFX_BASE64 -Password $env:WINDOWS_CERT_PASSWORD

      - name: Build Windows installer around the signed app
        shell: bash
        run: |
          export SNOWDRIFT_APP="$PWD/target/release/Snowdrift.exe"
          cargo build --release --features setup --bin Snowdrift-Setup

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            exit 0
          }
          ./scripts/sign-windows.ps1 -Files target/release/Snowdrift-Setup.exe -PfxBase64 $env:WINDOWS_CERT_PFX_BASE64 -Password $env:WINDOWS_CERT_PASSWORD

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/Snowdrift-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Snowdrift-Setup.exe" | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload Windows binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            target/release/Snowdrift-Setup.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
